name: uc-local-apex-dev
services:
  26ai:
    ports:
      - 1521:1521
    env_file:
      - ./.env
    volumes:
      - oradata-26ai:/opt/oracle/oradata
    restart: "${RESTART_POLICY:-no}"
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      #start_interval: 5s
    container_name: local-26ai
    image: container-registry.oracle.com/database/free:23.26.2.0

  ords-26ai:
    ports:
      - 8181:8080
      - 8443:8443
    volumes:
      - type: bind
        source: ords-config
        target: /etc/ords/config
        bind:
          selinux: z
          create_host_path: true
      - type: bind
        source: apex-images
        target: /opt/oracle/apex/images
        bind:
          selinux: z
          create_host_path: true
    restart: "${RESTART_POLICY:-no}"
    env_file:
      - ./.env
    environment:
      # ORDS maps DEBUG -> debug.printDebugToScreen on every boot. Interpolated
      # from .env (DEBUG_TO_SCREEN) so `install.sh --secure` can persistently turn
      # it off; defaults on for dev. NB: do not name the .env key ORDS_DEBUG --
      # that is reserved inside the ORDS launcher (JVM -agentlib:jdwp options).
      - DEBUG=${DEBUG_TO_SCREEN:-true}
    depends_on:
      26ai:
        condition: service_healthy
    image: container-registry.oracle.com/database/ords:26.2.1
    container_name: local-26ai-ords

networks:
  default:
    driver: bridge

volumes:
  oradata-26ai:
    name: oradata-26ai
