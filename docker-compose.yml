name: docker-apex-24-1
services:
  23ai:
    ports:
      - 1521:1521
    env_file:
      - ./.env
    volumes:
      - oradata:/opt/oracle/oradata
    restart: no
    healthcheck:
      #test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      #start_interval: 5s
    container_name: local-23ai
    image: container-registry.oracle.com/database/free:23.8.0.0

  ords:
    ports:
      - 8181:8080
    volumes:
      - type: bind
        source: ords-config
        target: /etc/ords/config
      - type: bind
        source: apex-images
        target: /opt/oracle/apex/images
    restart: no
    env_file:
      - ./.env
    depends_on:
      23ai:
        condition: service_healthy
    image: container-registry.oracle.com/database/ords:25.2.0
    container_name: local-ords

networks:
  default:
    driver: bridge

volumes:
  oradata:
    name: oradata
