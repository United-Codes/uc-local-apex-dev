name: uc-local-apex-dev
services:
  26ai:
    ports:
      - 1521:1521
    env_file:
      - ./.env
    volumes:
      - oradata-26ai:/opt/oracle/oradata
    restart: no
    healthcheck:
      #test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      #start_interval: 5s
    container_name: local-26ai
    image: container-registry.oracle.com/database/free:23.26.1.0

  ords-26ai:
    ports:
      - 8181:8080
      - 8443:8443
    volumes:
      - type: bind
        source: ords-config
        target: /etc/ords/config
      - type: bind
        source: apex-images
        target: /opt/oracle/apex/images
    restart: no
    env_file:
      - ./.env
    environment:
      - DEBUG=true
    depends_on:
      26ai:
        condition: service_healthy
    image: container-registry.oracle.com/database/ords:26.1.2
    container_name: local-26ai-ords

  # Optional dev-only SSO proxy. Sits in front of ORDS and always injects the
  # X-APEX-REMOTE-USER=ADMIN header so an APEX "HTTP Header Variable" auth scheme
  # logs in instantly without a real IdP. OFF by default: only starts when the
  # "sso" profile is active (set COMPOSE_PROFILES=sso in .env). Reachable at
  # https://localhost:8444/ords/ ; ORDS's own 8181/8443 ports stay available for
  # normal (non-SSO) access. HTTPS only — ORDS force-redirects plain HTTP.
  nginx-sso:
    profiles: ["sso"]
    image: nginx:1.27-alpine
    container_name: local-26ai-nginx-sso
    ports:
      - 8444:443
    volumes:
      - type: bind
        source: nginx-sso/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ords-config/ssl
        target: /etc/nginx/certs
        read_only: true
    depends_on:
      - ords-26ai
    restart: no

networks:
  default:
    driver: bridge

volumes:
  oradata-26ai:
    name: oradata-26ai
