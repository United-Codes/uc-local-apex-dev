name: docker-apex-24-1-${TENANT_NAME}
services:
  23ai-${TENANT_NAME}:
    ports:
      - ${TENANT_DB_PORT}:1521
    env_file:
      - ./.env
    volumes:
      - oradata-${TENANT_NAME}:/opt/oracle/oradata
    restart: no
    healthcheck:
      #test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      #start_interval: 5s
    container_name: 23ai-${TENANT_NAME}
    image: container-registry.oracle.com/database/free:23.6.0.0

  ords-${TENANT_NAME}:
    ports:
      - ${TENANT_ORDS_PORT}:8181
    volumes:
      - type: bind
        source: ords-secrets
        target: /opt/oracle/variables
      - type: bind
        source: ords-config
        target: /etc/ords/config
    restart: no
    env_file:
      - ./.env.ords
    depends_on:
      23ai-${TENANT_NAME}:
        condition: service_healthy
    image: container-registry.oracle.com/database/ords-developer:24.4.0
    container_name: ords-${TENANT_NAME}

networks:
  default:
    driver: bridge

volumes:
  oradata:
    name: oradata-${TENANT_NAME}
