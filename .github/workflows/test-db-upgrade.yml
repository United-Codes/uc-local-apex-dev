name: Test DB upgrade

# Manually-triggered datafile-compatibility gate. Installs the currently-pinned
# DB version, seeds a comprehensive schema, then upgrades in place to a newer
# image tag on the SAME oradata volume and asserts nothing was lost or
# invalidated. Run this when Oracle ships a new Free DB patch, e.g.
# container-registry.oracle.com/database/free:23.26.2.0.
on:
  workflow_dispatch:
    inputs:
      db_image:
        description: "New DB image tag to upgrade to, e.g. 23.26.2.0"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Two ~9 GB DB images (old + new) plus ~6 GB oradata do not fit in the
      # default 14 GB free on ubuntu-latest. This frees ~25 GB; we also drop the
      # old image once it is no longer in use (see "Upgrade DB image" step).
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install sqlv and SQLcl 26.1.2
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/United-Codes/sqlv/main/install.sh | bash
          export PATH="$HOME/sqlv/bin:$HOME/sqlv/current/bin:$PATH"
          sqlv install 26.1.2
          echo "$HOME/sqlv/bin" >> "$GITHUB_PATH"
          echo "$HOME/sqlv/current/bin" >> "$GITHUB_PATH"
          sql -V

      # Bring up the currently-pinned DB + APEX + ORDS on a fresh oradata volume.
      - name: Install current version
        run: ./install.sh

      - name: Create and seed upgrade-test schema
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          ./scripts/create-user.sh UPGRADE_TEST
          sql -S -name "${DB_CONN_BASE}-upgrade_test" @"$PWD/.github/fixtures/upgrade/seed.sql"

      # Sanity-check the fixtures pass on the OLD version before we upgrade, so a
      # later failure unambiguously means the upgrade broke something.
      - name: Baseline verify (pre-upgrade)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          sql -S -name "${DB_CONN_BASE}-upgrade_test" \
            @"$PWD/.github/fixtures/upgrade/verify.sql" \
            | sed 's/[[:space:]]*$//' | tee baseline.out

          grep -qx 'invalid=0'      baseline.out
          grep -qx 'departments=2'  baseline.out
          grep -qx 'employees=4'    baseline.out
          grep -qx 'audit_log=4'    baseline.out
          grep -qx 'view_rows=4'    baseline.out
          grep -qx 'fn_emp_count=4' baseline.out
          grep -qx 'eng_total=16000' baseline.out
          grep -qx 'eng_pipe=2'     baseline.out
          grep -qx 'mv_rows=2'      baseline.out
          grep -qx 'compressed_rows=500'       baseline.out
          grep -qx 'compressed_tab=ADVANCED'   baseline.out
          grep -qx 'compressed_idx=ADVANCED LOW' baseline.out

          # Snapshot the live APEX schema (run as SYS -- needs dba_* visibility).
          # Assert the hard invariants now, so a pre-existing APEX problem fails
          # here rather than being mistaken for upgrade damage later.
          sql -S -name "${DB_CONN_NAME}" \
            @"$PWD/.github/fixtures/upgrade/verify-apex.sql" \
            | sed 's/[[:space:]]*$//' | tee apex-baseline.out

          grep -qx 'apex_registry_status=VALID'   apex-baseline.out
          grep -qx 'apex_invalid=0'               apex-baseline.out
          grep -qx 'apex_apps_view_ok=yes'        apex-baseline.out
          grep -qx 'apex_workspaces_view_ok=yes'  apex-baseline.out

      - name: Stop database (graceful shutdown)
        run: ./local-26ai.sh stop

      # Drop the now-stopped old DB container and its image to reclaim space,
      # then point the (throwaway) checkout's compose file at the new tag. The
      # named oradata volume is untouched, so the next start upgrades in place.
      - name: Upgrade DB image
        run: |
          set -euo pipefail
          OLD_DB_IMAGE=$(grep -oE 'container-registry.oracle.com/database/free:[^"[:space:]]+' docker-compose.yml | head -1)
          echo "Old DB image: $OLD_DB_IMAGE"

          docker compose -f docker-compose.yml rm -f 26ai
          docker rmi "$OLD_DB_IMAGE" || true

          sed -i -E "s#(image: container-registry.oracle.com/database/free:).*#\1${{ inputs.db_image }}#" docker-compose.yml
          grep -n 'database/free:' docker-compose.yml

      # ./local-26ai.sh start runs `docker compose up -d`, which pulls the new
      # tag and recreates the DB container against the existing oradata volume.
      # The Oracle entrypoint then runs the in-place upgrade automatically.
      - name: Start new version (in-place upgrade)
        run: ./local-26ai.sh start

      - name: Wait for upgraded database to be ready
        run: |
          set -u
          deadline=$((SECONDS + 1500)) # 25 minutes
          while (( SECONDS < deadline )); do
            if docker compose -f docker-compose.yml logs 26ai 2>&1 | grep -q "DATABASE IS READY TO USE!"; then
              echo "Database is ready after upgrade."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: database did not become ready within 25 minutes" >&2
          docker compose -f docker-compose.yml logs 26ai 2>&1 | tail -100 >&2 || true
          exit 1

      - name: Verify data integrity (post-upgrade)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          sql -S -name "${DB_CONN_BASE}-upgrade_test" \
            @"$PWD/.github/fixtures/upgrade/verify.sql" \
            | sed 's/[[:space:]]*$//' | tee post.out

          # Same expectations as the baseline -- nothing lost or invalidated.
          grep -qx 'invalid=0'      post.out
          grep -qx 'departments=2'  post.out
          grep -qx 'employees=4'    post.out
          grep -qx 'audit_log=4'    post.out
          grep -qx 'view_rows=4'    post.out
          grep -qx 'fn_emp_count=4' post.out
          grep -qx 'eng_total=16000' post.out
          grep -qx 'eng_pipe=2'     post.out
          grep -qx 'mv_rows=2'      post.out
          grep -qx 'compressed_rows=500'       post.out
          grep -qx 'compressed_tab=ADVANCED'   post.out
          grep -qx 'compressed_idx=ADVANCED LOW' post.out

          # An upgrade actually happened: version_full changed from the baseline.
          # (Compared rather than matched to the tag, since version_full carries
          # extra components beyond the image tag.)
          # `|| true` so a missing line gives a clear assertion failure below
          # rather than silently aborting the step via `set -e`.
          old_ver=$(grep '^version_full=' baseline.out || true)
          new_ver=$(grep '^version_full=' post.out   || true)
          echo "before: $old_ver"
          echo "after:  $new_ver"
          test -n "$new_ver"            # version must be detectable post-upgrade
          test "$old_ver" != "$new_ver" # and must differ from the baseline

          # Re-snapshot the live APEX schema and assert the same hard invariants.
          sql -S -name "${DB_CONN_NAME}" \
            @"$PWD/.github/fixtures/upgrade/verify-apex.sql" \
            | sed 's/[[:space:]]*$//' | tee apex-post.out

          grep -qx 'apex_registry_status=VALID'   apex-post.out
          grep -qx 'apex_invalid=0'               apex-post.out
          grep -qx 'apex_apps_view_ok=yes'        apex-post.out
          grep -qx 'apex_workspaces_view_ok=yes'  apex-post.out

          # The APEX version is unchanged by a DB-image upgrade, so the whole
          # snapshot -- every per-type object count plus the version line -- must
          # match the baseline exactly. This is the core "APEX has a variety of
          # objects, none lost or invalidated" check, and needs no hardcoded
          # counts. (If a future DB upgrade legitimately changes an APEX count,
          # relax this to the grep invariants + an apex_objects equality check.)
          diff apex-baseline.out apex-post.out

      # DML must still flow: the audit trigger fires and sequences advance.
      - name: Verify writes still work (post-upgrade)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          sql -S -name "${DB_CONN_BASE}-upgrade_test" <<'SQL' | sed 's/[[:space:]]*$//' | tee writes.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          insert into employees (emp_name, dept_id, salary)
            values ('Eve', (select dept_id from departments where dept_name = 'Sales'), 3000);
          select 'audit_after=' || count(*) from audit_log;
          select 'seq_next='    || seq_ticket.nextval from dual;
          rollback;
          exit
          SQL
          grep -qx  'audit_after=5'    writes.out
          grep -qE '^seq_next=[0-9]+$' writes.out

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color 26ai     > artifacts/db.log   2>&1 || true
          docker compose logs --no-color ords-26ai > artifacts/ords.log 2>&1 || true
          docker compose ps > artifacts/ps.txt 2>&1 || true
          docker compose config > artifacts/compose-resolved.yml 2>&1 || true
          cp -f apex-baseline.out apex-post.out artifacts/ 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: artifacts/
          if-no-files-found: ignore
