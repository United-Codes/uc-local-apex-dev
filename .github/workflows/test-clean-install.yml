name: Test clean install

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "25-*"
      - "26-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Oracle Free image (~9 GB) + oradata after apexins (~6 GB) does not
      # fit in the default 14 GB of free space on ubuntu-latest. This action
      # frees ~25 GB by removing preinstalled toolchains we don't need.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install sqlv and SQLcl 25.4
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/United-Codes/sqlv/main/install.sh | bash
          export PATH="$HOME/sqlv/bin:$HOME/sqlv/current/bin:$PATH"
          sqlv install 25.4
          # Persist PATH for later steps
          echo "$HOME/sqlv/bin" >> "$GITHUB_PATH"
          echo "$HOME/sqlv/current/bin" >> "$GITHUB_PATH"
          sql -V

      - name: Generate .env
        run: ./setup.sh

      - name: Pull container images
        run: docker compose pull

      # The Oracle Free image ships its own HEALTHCHECK in the Dockerfile,
      # so `depends_on: service_healthy` works and ORDS will wait for the
      # DB on its own.
      - name: Start full stack (DB + ORDS)
        run: docker compose up -d

      - name: Wait for database to be ready
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            if docker compose logs 26ai 2>&1 | grep -q "DATABASE IS READY TO USE!"; then
              echo "Database is ready."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Database did not become ready within 25 minutes"
          docker compose logs 26ai
          exit 1

      # ORDS installs its DB-side schema (ORDS_METADATA + the public ORDS
      # synonym) on first boot. create-user.sh calls ords.enable_schema, so
      # we have to wait for that package to be in place before any user
      # script runs.
      - name: Wait for ORDS to be ready
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            count=$(sql -S "sys/${ORACLE_PASSWORD}@localhost:1521/FREEPDB1" as SYSDBA <<'SQL' | tr -d '[:space:]'
          set heading off feedback off pagesize 0
          select count(*) from dba_synonyms
           where owner = 'PUBLIC' and synonym_name = 'ORDS';
          exit
          SQL
          )
            if [ "$count" = "1" ]; then
              echo "ORDS is ready."
              exit 0
            fi
            sleep 10
          done
          echo "::error::ORDS did not finish installing within 15 minutes"
          docker compose logs ords-26ai
          exit 1

      # after-first-db-start.sh has one un-guarded `read` for the APEX
      # ADMIN password. Feed it a single newline so the default (Welcome_1)
      # is picked. The later archive-logs prompt is already TTY-guarded.
      - name: Run after-first-db-start (installs APEX)
        run: printf '\n' | ./scripts/after-first-db-start.sh

      - name: Verify apex-images folder layout
        run: |
          set -euo pipefail
          # Regression guard: a previous user hit `cp` nesting the source
          # folder into the destination (./apex-images/images/...). The
          # contents must live at the top of ./apex-images/ instead.
          test -f ./apex-images/apex_version.txt
          test -d ./apex-images/libraries
          test -d ./apex-images/themes
          test ! -e ./apex-images/images

      - name: Smoke test
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh
          sql -name "$DB_CONN_NAME" <<'SQL'
          whenever sqlerror exit failure
          set heading off feedback off
          select 'db_version: ' || banner_full from v$version where rownum = 1;
          select 'apex_version: ' || version_no from apex_release;
          select 'workspace_count: ' || count(*) from apex_workspaces;
          exit
          SQL

      # -----------------------------------------------------------------
      # Script tests — exercise the user-facing scripts against the real
      # DB+APEX that was just installed.
      # -----------------------------------------------------------------

      - name: Test create-user.sh
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          ./scripts/create-user.sh CITEST1

          # User and workspace must exist; saved sqlcl connection must work.
          # SQLcl right-pads output to the column width, so strip trailing
          # whitespace before asserting with `grep -qx`.
          sql -S -name "$DB_CONN_NAME" <<'SQL' | sed 's/[[:space:]]*$//' | tee create_user.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          select 'users=' || count(*) from dba_users where username = 'CITEST1';
          select 'ws='    || count(*) from apex_workspaces where workspace = 'CITEST1';
          exit
          SQL
          grep -qx 'users=1' create_user.out
          grep -qx 'ws=1'    create_user.out

          # .env must hold the generated password
          grep -q '^CITEST1_USER_PASSWORD=' .env

          # The saved per-user connection must be usable
          sql -S -name "${DB_CONN_BASE}-citest1" <<'SQL' | sed 's/[[:space:]]*$//' | tee whoami.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          select user from dual;
          exit
          SQL
          grep -qx 'CITEST1' whoami.out

      - name: Test test-script-install.sh
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          # test-script-install.sh resolves relative paths against $ORIGINAL_PWD
          # (which isn't always set), so pass an absolute path to be safe.
          ./scripts/test-script-install.sh "$PWD/.github/fixtures/test_install.sql" -y

          sql -S -name "${DB_CONN_BASE}-uc_testinstall_1" <<'SQL' | sed 's/[[:space:]]*$//' | tee install.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          select 'table='   || count(*) from user_tables  where table_name  = 'T_WIDGETS';
          select 'pkg='     || count(*) from user_objects where object_type = 'PACKAGE'      and object_name = 'PKG_WIDGETS' and status = 'VALID';
          select 'pkgbody=' || count(*) from user_objects where object_type = 'PACKAGE BODY' and object_name = 'PKG_WIDGETS' and status = 'VALID';
          select 'rows='    || pkg_widgets.get_count from dual;
          select 'invalid=' || count(*) from user_objects where status = 'INVALID';
          exit
          SQL
          grep -qx 'table=1'   install.out
          grep -qx 'pkg=1'     install.out
          grep -qx 'pkgbody=1' install.out
          grep -qx 'rows=3'    install.out
          grep -qx 'invalid=0' install.out

      - name: Seed CITEST1 with test data for backup
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          sql -S -name "${DB_CONN_BASE}-citest1" <<'SQL'
          whenever sqlerror exit failure
          create table t_backup_data (
            id  number generated by default as identity primary key,
            val varchar2(100) not null
          );
          insert into t_backup_data (val) values ('row-one');
          insert into t_backup_data (val) values ('row-two');
          insert into t_backup_data (val) values ('row-three');
          commit;
          exit
          SQL

      - name: Test backup-user.sh
        run: |
          set -euo pipefail
          ./scripts/backup-user.sh CITEST1

          # Datapump dump must exist and be non-empty.
          test -s ./backups/export/citest1.dmp
          # APEX workspace export must produce at least one w*.sql file.
          ls ./backups/export/apex/citest1/w*.sql >/dev/null

      - name: Test drop-user.sh
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          # drop-user.sh has an unguarded `read` — feed it a 'y'.
          printf 'y\n' | ./scripts/drop-user.sh CITEST1

          sql -S -name "$DB_CONN_NAME" <<'SQL' | sed 's/[[:space:]]*$//' | tee drop.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          select 'users=' || count(*) from dba_users where username = 'CITEST1';
          exit
          SQL
          grep -qx 'users=0' drop.out

          # drop-user.sh comments out the password line in .env
          grep -q '^# *CITEST1_USER_PASSWORD=' .env

      - name: Test import-backup.sh (round-trip)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          # Stage the previously-exported artifacts as if they came from
          # another machine.
          mkdir -p ./backups/import/apex
          cp ./backups/export/citest1.dmp ./backups/import/citest1.dmp
          cp -r ./backups/export/apex/citest1 ./backups/import/apex/citest1

          ./scripts/import-backup.sh CITEST1 -y

          # Reload .env — import-backup re-created the user with a new
          # generated password and appended a fresh line.
          # shellcheck disable=SC1091
          source ./scripts/util/load_env.sh

          sql -S -name "${DB_CONN_BASE}-citest1" <<'SQL' | sed 's/[[:space:]]*$//' | tee restore.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          select 'users='  || count(*) from dba_users where username = 'CITEST1';
          select 'table='  || count(*) from user_tables where table_name = 'T_BACKUP_DATA';
          select 'rows='   || count(*) from t_backup_data;
          select 'values=' || listagg(val, ',') within group (order by val) from t_backup_data;
          exit
          SQL
          grep -qx 'users=1'                       restore.out
          grep -qx 'table=1'                       restore.out
          grep -qx 'rows=3'                        restore.out
          grep -qx 'values=row-one,row-three,row-two' restore.out

          sql -S -name "$DB_CONN_NAME" <<'SQL' | sed 's/[[:space:]]*$//' | tee restore_ws.out
          whenever sqlerror exit failure
          set heading off feedback off pagesize 0
          select 'ws=' || count(*) from apex_workspaces where workspace = 'CITEST1';
          exit
          SQL
          grep -qx 'ws=1' restore_ws.out

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color 26ai     > artifacts/db.log   2>&1 || true
          docker compose logs --no-color ords-26ai > artifacts/ords.log 2>&1 || true
          docker compose ps > artifacts/ps.txt 2>&1 || true
          docker compose config > artifacts/compose-resolved.yml 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: artifacts/
          if-no-files-found: ignore
