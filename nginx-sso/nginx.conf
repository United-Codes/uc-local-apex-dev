events {}

http {
  # Proxy to ORDS's HTTPS connector (8443), NOT 8080. ORDS standalone
  # force-redirects plain HTTP to its secure port at the connector level (it
  # ignores X-Forwarded-Proto and security.forceHTTPS), which bounces the
  # browser off this proxy. Speaking HTTPS makes ORDS serve normally and build
  # absolute URLs from the forwarded Host, keeping the client here.
  #
  # nginx resolves this name once at startup, so after `docker compose restart
  # ords-26ai` (which can give ORDS a new IP) recreate this proxy too:
  #   docker compose --profile sso up -d --force-recreate nginx-sso
  upstream ords {
    server ords-26ai:8443;
  }

  # HTTPS only. nginx does not verify the upstream cert by default, so ORDS's
  # self-signed cert is accepted.
  #
  # proxy_set_header X-APEX-REMOTE-USER OVERWRITES any client-sent value, so the
  # SSO header cannot be spoofed. Dev only: always authenticate as ADMIN. To
  # change the injected user, edit the line below and restart the nginx-sso
  # container.
  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/key.key;

    location / {
      proxy_pass         https://ords;
      # ORDS's APEX PL/SQL gateway returns 500 on HTTP/1.0 (nginx's default to
      # upstreams). Force 1.1 and clear Connection so keepalive works.
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      # $http_host (not $host) keeps the :8444 port, so ORDS builds redirect
      # URLs that stay on this proxy instead of dropping to the default :443.
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-APEX-REMOTE-USER "ADMIN";   # <-- the SSO user
    }
  }
}
